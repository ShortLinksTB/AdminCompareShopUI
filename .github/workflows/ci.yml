name: CI

on:
  pull_request:
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      # No npm test: this repository has no test tooling yet.
      # Add a test framework and tests in a separate follow-up issue.
      - run: npm run build

  publish-image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/shortlinkstb/admin-compare-shop-ui:${{ github.sha }}
            ghcr.io/shortlinkstb/admin-compare-shop-ui:dev
